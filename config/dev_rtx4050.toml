# Development profile - Machine A: NVIDIA RTX 4050 Laptop 6 GB
# Uses a tiny RANDOM-WEIGHT pipeline with the real Wan2.2 classes/tokenizer/scheduler,
# so the full code path runs on the GPU in seconds without the 34 GB download.
# Output is coloured noise by design.
profile = "dev_rtx4050"

[model]
backend  = "tiny"
repo_id  = "Wan-AI/Wan2.2-TI2V-5B-Diffusers"
revision = "b8fff7315c768468a5333511427288870b2e9635"
local_dir = "models/Wan2.2-TI2V-5B-Diffusers"   # only tokenizer + *.json configs needed for tiny backend

[device]
gpu_index = 0
expect_gpu_name = "4050"
strict_gpu_check = false

[precision]
transformer  = "bfloat16"
text_encoder = "bfloat16"
vae          = "float32"

[memory]
offload = "none"
vae_tiling = false
oom_fallback = true
attention = "sdpa"

[generation]
width  = 320
height = 192
num_frames = 25
fps   = 24
steps = 8
guidance_scale = 5.0
seed = 42
max_frames = 121

[output]
video_dir  = "outputs/videos"
frames_dir = "outputs/frames"
crf = 18
preset = "medium"

# ---- `episode` pipeline (keyframes -> image-to-video, TTS, music, SFX, mix) ----
[image]
backend  = "tiny"   # flux (FLUX.1-schnell, gated: free HF login) | wan (Wan2.2 single-frame, no extra download) | tiny
repo_id  = "black-forest-labs/FLUX.1-schnell"
revision = "741f7c3ce8b383c54771c7003378a50191e9efe9"
local_dir = "models/FLUX.1-schnell"
steps = 4
offload = "group"

[audio]
tts_backend = "kokoro"
tts_repo_id = "hexgrad/Kokoro-82M"
tts_revision = "f3ff3571791e39611d31c381e3a41a3af07b4987"
tts_local_dir = "models/Kokoro-82M"
tts_device = "cpu"
music_backend = "tiny"   # acestep runs in its own venv (.venv-audio): its pins clash with diffusers 0.36
music_repo_id = "ACE-Step/ACE-Step-v1-3.5B"
music_revision = "82cd0d7b6322bd28cd4e830fe675ddb6180ce36c"
music_local_dir = "models/ACE-Step-v1-3.5B"
music_python = ""
music_steps = 60
sample_rate = 48000
target_lufs = -14.0
true_peak_db = -1.0
duck_db = -12.0
